[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ellipsoid-fit"
version = "0.1.0"
description = "Fit maximum-volume inscribed and minimum-volume enclosing ellipsoids to 2D/3D point clouds"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "cvxpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["ellipsoid_fit"]
